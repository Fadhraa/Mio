[package]
name = "mio-notch"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }



[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z" # Ukuran biner sekecil mungkin
strip = true


